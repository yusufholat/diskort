<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>kozmetik oynatma doğrulaması</title>
<!--
  Çizim aracının oynatma doğrulaması (render.mjs → electron-main.cjs, GİZLİ pencerede). Kodlanan her dosyayı
  Chromium'un kendi çözücüsüyle açar:
  - decode: belirli kareleri çözer, pikselleri geri okur, kaynak karelerle karşılaştırır (kalite, alfa, saçak,
    yığılmış videoda iki yarı arasında sızıntı, ilk ve son kare);
  - show: hepsini sayfada oynatır (ana süreç iki ayrı anda görüntü alıp değiştiğine bakar);
  - timing: <video loop> döngü başında takılıyor mu (requestVideoFrameCallback zamanları).
-->
<style>
  body { margin: 0; background: #3a3f46; }
  #grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; }
  #grid > * { display: block; }
</style>
<script src="stacked.js"></script>
</head>
<body>
<div id="grid"></div>
<script>
(() => {
  const fs = require('node:fs');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const frame = () => new Promise((r) => requestAnimationFrame(r));
  const round = (x, d = 3) => Number(x.toFixed(d));
  const blobUrl = (item) => URL.createObjectURL(new Blob([fs.readFileSync(item.path)], { type: item.mime }));

  function readSource(item, index) {
    const size = item.width * item.height * 4;
    const buf = new Uint8Array(size);
    const fd = fs.openSync(item.source, 'r');
    fs.readSync(fd, buf, 0, size, index * size);
    fs.closeSync(fd);
    return buf;
  }
  /** Düz RGBA → alfayla çarpılmış (ondalıklı) */
  function premultiply(straight) {
    const out = new Float32Array(straight.length);
    for (let i = 0; i < straight.length; i += 4) {
      const a = straight[i + 3];
      out[i] = (straight[i] * a) / 255;
      out[i + 1] = (straight[i + 1] * a) / 255;
      out[i + 2] = (straight[i + 2] * a) / 255;
      out[i + 3] = a;
    }
    return out;
  }
  function meanDiff(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]);
    return s / a.length;
  }

  /** Çözülen kareleri (alfayla çarpılmış) kaynakla karşılaştıran toplayıcı */
  function makeStats(item) {
    const w = item.width;
    const S = { se: 0, n: 0, alphaErr: 0, px: 0, clearSum: 0, clearMax: 0, clearN: 0, fringe: 0, fringeN: 0, edgeC: 0, edgeCN: 0, edgeA: 0, edgeAN: 0, colorErr: 0 };
    return {
      add(decoded, index) {
        const src = premultiply(readSource(item, index));
        for (let i = 0, p = 0; i < src.length; i += 4, p++) {
          const x = p % w;
          let cErr = 0;
          for (let c = 0; c < 3; c++) {
            const d = decoded[i + c] - src[i + c];
            S.se += d * d;
            cErr += Math.abs(d);
          }
          const da = decoded[i + 3] - src[i + 3];
          S.se += da * da;
          S.n += 4;
          S.alphaErr += Math.abs(da);
          S.colorErr += cErr / 3;
          S.px++;
          const sa = src[i + 3];
          if (sa === 0) {
            // saydam olması gereken yer
            S.clearSum += decoded[i + 3];
            if (decoded[i + 3] > S.clearMax) S.clearMax = decoded[i + 3];
            S.clearN++;
          } else if (sa < 64) {
            // yarı saydam kenar: koyu saçak eksi, parlak hale artı çıkar
            S.fringe += (decoded[i] + decoded[i + 1] + decoded[i + 2] - src[i] - src[i + 1] - src[i + 2]) / 3;
            S.fringeN++;
          }
          // yığılmış videoda yarıların birbirine bakan kenarları: rengin son, alfanın ilk 4 sütunu
          if (x >= w - 4) {
            S.edgeC += cErr / 3;
            S.edgeCN++;
          }
          if (x < 4) {
            S.edgeA += Math.abs(da);
            S.edgeAN++;
          }
        }
      },
      result() {
        const mse = S.se / Math.max(1, S.n);
        return {
          psnr: round(10 * Math.log10((255 * 255) / Math.max(mse, 1e-9)), 2),
          alphaMae: round(S.alphaErr / Math.max(1, S.px)),
          clearAlphaMean: round(S.clearSum / Math.max(1, S.clearN)),
          clearAlphaMax: round(S.clearMax, 1),
          fringe: round(S.fringe / Math.max(1, S.fringeN)),
          // kenar sütunları her biçimde ölçülür: yığılmış videonun sızıntısı, yığılmamış biçimlerin aynı sütunlardaki
          // hatasıyla karşılaştırılarak anlaşılır (kartta buz zaten kenarlarda yoğun, hata orada doğal olarak yüksek)
          edge: { color: round(S.edgeC / Math.max(1, S.edgeCN)), alpha: round(S.edgeA / Math.max(1, S.edgeAN)), allColor: round(S.colorErr / Math.max(1, S.px)), allAlpha: round(S.alphaErr / Math.max(1, S.px)) },
        };
      },
    };
  }

  function dump(item, decoded) {
    const out = new Uint8Array(decoded.length);
    for (let i = 0; i < decoded.length; i += 4) {
      const a = decoded[i + 3];
      const k = a > 0 ? 255 / a : 0;
      out[i] = Math.min(255, Math.round(decoded[i] * k));
      out[i + 1] = Math.min(255, Math.round(decoded[i + 1] * k));
      out[i + 2] = Math.min(255, Math.round(decoded[i + 2] * k));
      out[i + 3] = Math.round(a);
    }
    fs.writeFileSync(item.dump, out);
  }

  async function loadVideo(item) {
    const video = document.createElement('video');
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';
    video.src = blobUrl(item);
    await new Promise((resolve, reject) => {
      video.addEventListener('loadeddata', resolve, { once: true });
      video.addEventListener('error', () => reject(new Error('video açılamadı: ' + (video.error ? video.error.message || 'kod ' + video.error.code : 'bilinmiyor'))), { once: true });
    });
    const ew = item.stacked ? item.stacked.width : item.width;
    const eh = item.stacked ? item.stacked.height : item.height;
    if (video.videoWidth !== ew || video.videoHeight !== eh) throw new Error(`video boyutu ${video.videoWidth}×${video.videoHeight}, beklenen ${ew}×${eh}`);
    return video;
  }

  async function decodeItem(item) {
    const stats = makeStats(item);
    const w = item.width;
    const h = item.height;
    const want = new Set(item.checkFrames);
    const lastIndex = item.sourceFrames - 1;
    let first = null;
    let last = null;
    let a = null;
    let b = null;
    let frames = 0;
    let durationMs = 0;
    // Kodlanmış dosyanın kesintisizliği: çözülen BÜTÜN karelerin ardışık farkı ve düzeyi (son → ilk dahil).
    // Sıkıştırmanın eklediği sıçrama (ör. döngü başındaki anahtar kare) böyle görülür; karar render.mjs'te.
    const series = { mean: new Array(item.sourceFrames).fill(0), level: new Array(item.sourceFrames).fill(0) };
    let prev = null;
    let prevLevel = [0, 0];
    let firstLevel = [0, 0];
    // düzey: ortalama parlaklık ve ortalama alfa (continuity.mjs frameLevel ile aynı ölçü)
    const levelOf = (d) => {
      let rgb = 0;
      let alpha = 0;
      for (let i = 0; i < d.length; i += 4) {
        rgb += (d[i] + d[i + 1] + d[i + 2]) / 3;
        alpha += d[i + 3];
      }
      return [rgb / (d.length / 4), alpha / (d.length / 4)];
    };
    const levelStep = (x, y) => Math.abs(x[0] - y[0]) + Math.abs(x[1] - y[1]);
    const take = (decoded, index) => {
      const level = levelOf(decoded);
      if (prev) {
        // aradaki kareler (kodlayıcının birleştirdiği aynı kareler) sıfır kalır
        series.mean[index - 1] = meanDiff(prev, decoded);
        series.level[index - 1] = levelStep(level, prevLevel);
      } else firstLevel = level;
      prev = decoded;
      prevLevel = level;
      if (want.has(index)) stats.add(decoded, index);
      if (index === 0) first = decoded;
      if (index === lastIndex) last = decoded;
      if (index === item.checkFrames[1]) a = decoded;
      if (index === item.checkFrames[3]) b = decoded;
      if (index === item.dumpFrame) dump(item, decoded);
    };
    const c2 = new OffscreenCanvas(w, h);
    const ctx = c2.getContext('2d', { willReadFrequently: true });
    const read2d = (source) => {
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(source, 0, 0);
      return premultiply(ctx.getImageData(0, 0, w, h).data);
    };
    if (item.tag === 'img') {
      // Hareketli resim: tarayıcının resim çözücüsü (WebCodecs ImageDecoder), kareler zaman damgasıyla eşlenir
      const dec = new ImageDecoder({ data: fs.readFileSync(item.path), type: item.mime });
      await dec.tracks.ready;
      await dec.completed;
      frames = dec.tracks.selectedTrack.frameCount;
      for (let i = 0; i < frames; i++) {
        const { image } = await dec.decode({ frameIndex: i });
        // kodlayıcı aynı kareleri birleştirmiş olabilir: son kare kaynağın son karesine denk gelir
        const index = i === frames - 1 ? lastIndex : Math.round((image.timestamp / 1e6) * item.fps);
        durationMs = (image.timestamp + (image.duration ?? 0)) / 1000;
        take(read2d(image), index);
        image.close();
      }
      dec.close();
    } else {
      const video = await loadVideo(item);
      durationMs = video.duration * 1000;
      frames = Math.round(video.duration * item.fps);
      let player = null;
      let glCanvas = null;
      if (item.stacked) {
        glCanvas = document.createElement('canvas');
        player = window.StackedAlpha.create(glCanvas, item.stacked);
      }
      for (let index = 0; index < item.sourceFrames; index++) {
        video.currentTime = (index + 0.5) / item.fps;
        await new Promise((resolve) => video.addEventListener('seeked', resolve, { once: true }));
        await frame();
        await frame();
        let decoded;
        if (player) {
          // birleştiricinin çıktısı zaten alfayla çarpılmış; GL satırları alttan başlar
          player.draw(video);
          const gl = player.gl;
          const px = new Uint8Array(w * h * 4);
          gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
          decoded = new Float32Array(w * h * 4);
          for (let y = 0; y < h; y++) decoded.set(px.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
        } else decoded = read2d(video);
        take(decoded, index);
      }
      URL.revokeObjectURL(video.src);
      video.removeAttribute('src');
      video.load();
    }
    if (!first || !last || !a || !b) throw new Error('beklenen kareler çözülemedi');
    // dikiş: son kare → ilk kare
    series.mean[lastIndex] = meanDiff(last, first);
    series.level[lastIndex] = levelStep(firstLevel, prevLevel);
    return {
      ...stats.result(),
      frames,
      durationMs: Math.round(durationMs),
      seam: round(series.mean[lastIndex]),
      framesDiffer: round(meanDiff(a, b)),
      series: { mean: series.mean.map((x) => round(x, 4)), level: series.level.map((x) => round(x, 4)) },
    };
  }

  /**
   * AVIF'te sırasız çözme: Chromium'un resim çözücüsü kareler baştan sırayla istendiğinde doğru, ama bir kare
   * atlanınca, tam bir turdan sonra başa dönülünce ya da ortadan başlanınca renk aralığını karıştırabiliyor
   * (sınırlı aralıklı renk tam aralık sanılır: koyular açılır, doygunluk düşer; uygulamada yaşandı). Dosya üç
   * düzende çözülür ve her kare ffmpeg'in aynı dosyadan çözdüğü karelerle karşılaştırılır (item.reference):
   * - atlayarak: 0, 1, 2, 4, 8, … ve son kare;
   * - tam tur: 0'dan sona sırayla, sonra yeniden 0, 1, 2;
   * - ortadan: yeni bir çözücüyle ortadaki kare, iki sonraki, sonra 0 ve çeyrek (bir sonraki için aşağıya bakın).
   * Ölçü: alfanın yarıdan fazla olduğu piksellerde düz rengin ortalama mutlak farkı (0-255) ve alfa farkı;
   * ayrıca başta sabitlenen birkaç nokta (en koyu, en açık, en doygun) iki çözümde yan yana.
   */
  async function accessItem(item) {
    const w = item.width;
    const h = item.height;
    const n = item.sourceFrames;
    const px = w * h;
    const readRef = (index) => {
      const color = new Uint8Array(px * 3);
      const alpha = new Uint8Array(px);
      const fc = fs.openSync(item.reference.color, 'r');
      fs.readSync(fc, color, 0, color.length, index * color.length);
      fs.closeSync(fc);
      const fa = fs.openSync(item.reference.alpha, 'r');
      fs.readSync(fa, alpha, 0, alpha.length, index * alpha.length);
      fs.closeSync(fa);
      return { color, alpha };
    };
    // sabit noktalar: ilk karede alfası yüksek pikseller arasından en koyu, en açık, en doygun
    const ref0 = readRef(0);
    const pick = { dark: -1, light: -1, sat: -1 };
    let best = { dark: Infinity, light: -Infinity, sat: -Infinity };
    for (let p = 0; p < px; p++) {
      if (ref0.alpha[p] < 200) continue;
      const r = ref0.color[p * 3];
      const g = ref0.color[p * 3 + 1];
      const b = ref0.color[p * 3 + 2];
      const l = r + g + b;
      const s = Math.max(r, g, b) - Math.min(r, g, b);
      if (l < best.dark) (best.dark = l), (pick.dark = p);
      if (l > best.light) (best.light = l), (pick.light = p);
      if (s > best.sat) (best.sat = s), (pick.sat = p);
    }
    const c2 = new OffscreenCanvas(w, h);
    const ctx = c2.getContext('2d', { willReadFrequently: true });
    const compare = (image, index) => {
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(image, 0, 0);
      const d = ctx.getImageData(0, 0, w, h).data;
      const ref = readRef(index);
      let cs = 0;
      let cn = 0;
      let as = 0;
      for (let p = 0; p < px; p++) {
        as += Math.abs(d[p * 4 + 3] - ref.alpha[p]);
        if (ref.alpha[p] < 128 || d[p * 4 + 3] < 128) continue;
        cs += (Math.abs(d[p * 4] - ref.color[p * 3]) + Math.abs(d[p * 4 + 1] - ref.color[p * 3 + 1]) + Math.abs(d[p * 4 + 2] - ref.color[p * 3 + 2])) / 3;
        cn++;
      }
      const points = {};
      if (index === 0) {
        for (const [k, p] of Object.entries(pick)) {
          if (p < 0) continue;
          points[k] = { decoded: [d[p * 4], d[p * 4 + 1], d[p * 4 + 2]], ffmpeg: [ref.color[p * 3], ref.color[p * 3 + 1], ref.color[p * 3 + 2]] };
        }
      }
      return { index, color: round(cn ? cs / cn : 0), alpha: round(as / px), points: index === 0 ? points : undefined };
    };
    const open = async () => {
      const dec = new ImageDecoder({ data: fs.readFileSync(item.path), type: item.mime });
      await dec.tracks.ready;
      await dec.completed;
      return dec;
    };
    const run = async (dec, order) => {
      const out = [];
      for (const index of order) {
        try {
          const { image } = await dec.decode({ frameIndex: index });
          out.push(compare(image, index));
          image.close();
        } catch (err) {
          out.push({ index, error: String(err && err.message ? err.message : err) });
        }
      }
      return out;
    };
    const skips = [0, 1, 2];
    for (let k = 4; k < n; k *= 2) skips.push(k);
    skips.push(n - 1);
    const full = [...Array(n).keys(), 0, 1, 2];
    const mid = Math.floor(n / 2);
    const scenarios = {};
    let dec = await open();
    scenarios.skip = await run(dec, skips);
    dec.close();
    dec = await open();
    const fullPass = await run(dec, full);
    dec.close();
    // tam turun kendisi (sıralı çözme) ayrı: karşılaştırmanın taban çizgisi; sonra başa dönüş
    scenarios.inOrder = fullPass.slice(0, n);
    scenarios.wrap = fullPass.slice(n);
    dec = await open();
    scenarios.cold = await run(dec, [mid, mid + 2, 0, Math.floor(n / 4)]);
    dec.close();
    // Bilgi için (dosyayı düşürmez): ortadan başlayan çözücüde hemen SONRAKİ kare istenince Chromium "Failed to
    // decode frame" verip çözücüyü kapatıyor (k'dan başlayınca k+1; k+2, geri 0 ya da önce 0 çözülmüşse sorun
    // yok). Sınırlı / tam aralıkta, her kare anahtar ya da değil, hepsinde aynı: dosyadan değil çözücüden.
    dec = await open();
    scenarios.coldNext = await run(dec, [mid, mid + 1]);
    dec.close();
    const summary = {};
    for (const [k, all] of Object.entries(scenarios)) {
      const list = all.filter((x) => !x.error);
      const errors = all.filter((x) => x.error);
      const wc = list.reduce((m, x) => (x.color > m.color ? x : m), list[0] || { color: 0, index: -1 });
      summary[k] = { worstColor: wc.color, worstAt: wc.index, worstAlpha: round(Math.max(0, ...list.map((x) => x.alpha))), frames: list.length, errors: errors.map((x) => `${x.index}: ${x.error}`) };
    }
    // frame 0 noktaları: sıralı çözmede ve başa dönüşte (asıl bozulma burada görülüyordu)
    const points = { inOrder: scenarios.inOrder[0].points, afterWrap: scenarios.wrap[0].points, afterColdStart: (scenarios.cold.find((x) => x.index === 0) || {}).points };
    return { summary, points };
  }

  async function decode(items) {
    const out = [];
    for (const item of items) {
      try {
        const r = { file: item.file, ...(await decodeItem(item)) };
        if (item.reference) r.access = await accessItem(item);
        out.push(r);
      } catch (err) {
        out.push({ file: item.file, error: String(err && err.message ? err.message : err) });
      }
    }
    return out;
  }

  /** show() ile oynatılan videolar (zamanlama ölçümünden önce durdurulur) */
  const playing = [];

  /** Hepsini sayfada oynatır; dönen dikdörtgenlerden ana süreç görüntü alır */
  async function show(items) {
    const grid = document.getElementById('grid');
    const cells = [];
    for (const item of items) {
      const cw = 150;
      const ch = Math.round((cw * item.height) / item.width);
      let el;
      if (item.tag === 'img') {
        el = new Image();
        el.src = blobUrl(item);
      } else if (item.stacked) {
        const video = document.createElement('video');
        Object.assign(video, { muted: true, loop: true, playsInline: true, src: blobUrl(item) });
        el = document.createElement('canvas');
        window.StackedAlpha.attach(video, el, item.stacked);
        video.play().catch(() => {});
        playing.push(video);
      } else {
        el = document.createElement('video');
        Object.assign(el, { muted: true, loop: true, playsInline: true, src: blobUrl(item) });
        el.play().catch(() => {});
        playing.push(el);
      }
      el.style.width = cw + 'px';
      el.style.height = ch + 'px';
      grid.append(el);
      cells.push({ file: item.file, el });
    }
    await sleep(300);
    return cells.map((c) => {
      const r = c.el.getBoundingClientRect();
      return { file: c.file, x: Math.round(r.x), y: Math.round(r.y), width: Math.round(r.width), height: Math.round(r.height) };
    });
  }

  /** <video loop>: kareler ekrana hangi anda geliyor; döngü başındaki boşluk olağan kare aralığından uzun mu */
  async function timing(items, loopSeconds) {
    // öncekiler dursun: ölçüm tek video oynarken yapılır
    for (const v of playing) {
      v.pause();
      v.removeAttribute('src');
      v.load();
    }
    document.getElementById('grid').textContent = '';
    await sleep(500);
    const out = [];
    for (const item of items) {
      const video = document.createElement('video');
      Object.assign(video, { muted: true, loop: true, playsInline: true, src: blobUrl(item) });
      video.style.width = '300px';
      document.getElementById('grid').append(video);
      const log = [];
      const onFrame = (_now, meta) => {
        log.push([meta.expectedDisplayTime, meta.mediaTime, meta.presentedFrames]);
        video.requestVideoFrameCallback(onFrame);
      };
      video.requestVideoFrameCallback(onFrame);
      await video.play();
      await sleep(loopSeconds * 3300);
      video.pause();
      video.remove();
      const gaps = [];
      const wraps = [];
      // ilk yarım saniye sayılmaz (çözücünün açılışı)
      const skip = log.findIndex((e) => e[0] - log[0][0] > 500);
      for (let i = Math.max(1, skip); i < log.length; i++) {
        const dt = log[i][0] - log[i - 1][0];
        if (log[i][1] < log[i - 1][1]) wraps.push({ at: i, dt });
        else gaps.push(dt);
      }
      const sorted = [...gaps].sort((x, y) => x - y);
      // iki döngü başı arasında ekrana gelen kare sayısı (tam döngüler)
      const framesPerLoop = [];
      for (let i = 1; i < wraps.length; i++) framesPerLoop.push(wraps[i].at - wraps[i - 1].at);
      out.push({
        file: item.file,
        timing: {
          callbacks: log.length,
          wrapGapsMs: wraps.map((x) => round(x.dt, 1)),
          typicalMs: round(sorted[Math.floor(sorted.length / 2)] ?? 0, 1),
          maxOtherMs: round(sorted[sorted.length - 1] ?? 0, 1),
          longGaps: gaps.filter((g) => g > 50).length,
          framesPerLoop,
        },
      });
    }
    return out;
  }

  /** Yalnızca sırasız çözme denetimi (verify'ın parçası; tek başına da çağrılabilir) */
  async function access(items) {
    const out = [];
    for (const item of items) {
      try {
        out.push({ file: item.file, access: await accessItem(item) });
      } catch (err) {
        out.push({ file: item.file, error: String(err && err.message ? err.message : err) });
      }
    }
    return out;
  }
