# Yerel geliştirme için LiveKit yapılandırması.
# Başlatma: pnpm dev:livekit
port: 7880
bind_addresses:
  - 0.0.0.0

# Tüm medya tek UDP portundan (7882) akar; arkadaşlarla VPN/LAN üzerinden test ederken
# güvenlik duvarında yalnızca TCP 3000/7880/7881 ve UDP 7882 açmak yeterlidir.
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

# apps/server/src/config.ts içindeki geliştirme anahtarıyla aynı olmalı
keys:
  devkey: diskort-dev-livekit-secret-0123456789abcdef

room:
  auto_create: true
  empty_timeout: 30
  departure_timeout: 10

# Konuşan göstergesinin Discord gibi hızlı tepki vermesi için sık güncelleme
audio:
  active_level: 35
  min_percentile: 40
  update_interval: 100
  smooth_intervals: 1

webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:3000/api/livekit/webhook

logging:
  level: info
