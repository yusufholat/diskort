[package]
name = "diskort-dfwasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
deep_filter = { path = "../libDF", default-features = false, features = ["tract"] }
ndarray = "0.16"
# tract-onnx-opl getrandom'a bağlı; wasm32-unknown-unknown için JS'siz sabit kaynak kaydedilir
getrandom = { version = "0.2", features = ["custom"] }
# 0.21.18: wasm simd128 matris çarpım çekirdeği olan (0.21.6+) ve DFN3 modelini sorunsuz derleyen
# son 0.21 sürümü (libDF ^0.21.4 aralığında). ndarray 0.16 gerektirir; libDF buna göre yamalanır.
tract-core = "=0.21.18"
tract-onnx = "=0.21.18"
tract-pulse = "=0.21.18"
tract-hir = "=0.21.18"
