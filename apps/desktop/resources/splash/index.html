<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Diskort</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #1e1f22; color: #dbdee1; user-select: none; cursor: default; overflow: hidden;
        font: 14px 'Segoe UI Variable Text', 'Segoe UI', 'Noto Sans', 'Helvetica Neue', system-ui, sans-serif;
        -webkit-app-region: drag; padding: 24px;
      }
      .logo { width: 88px; height: 88px; border-radius: 24px; animation: pulse 1.6s ease-in-out infinite; }
      .still .logo { animation: none; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.92); } }
      #title { margin-top: 22px; font-size: 15px; font-weight: 600; color: #f2f3f5; text-align: center; }
      #detail { margin-top: 6px; min-height: 18px; font-size: 12.5px; color: #949ba4; text-align: center; line-height: 1.4; }
      .bar { width: 180px; height: 6px; margin-top: 14px; border-radius: 3px; background: #313338; overflow: hidden; visibility: hidden; }
      .bar.show { visibility: visible; }
      .fill { height: 100%; width: 0; background: #5865f2; border-radius: 3px; transition: width 0.2s linear; }
      .bar.busy .fill { width: 35%; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
      #actions { display: flex; gap: 8px; margin-top: 18px; -webkit-app-region: no-drag; }
      button {
        font: inherit; font-size: 13px; font-weight: 500; border: 0; border-radius: 4px; padding: 7px 14px;
        color: #fff; background: #5865f2; cursor: pointer;
      }
      button:hover { background: #4752c4; }
      button.secondary { background: #4e5058; }
      button.secondary:hover { background: #6d6f78; }
    </style>
  </head>
  <body>
    <img class="logo" src="../icon.png" alt="" />
    <div id="title">Başlatılıyor…</div>
    <div id="detail"></div>
    <div class="bar busy" id="bar"><div class="fill" id="fill"></div></div>
    <div id="actions"></div>
    <script>
      const $ = (id) => document.getElementById(id);
      const mb = (bytes) => (bytes / 1048576).toFixed(1).replace('.', ',');

      // Düğmeler ana sürece adres çubuğunun # kısmıyla haber verir (ön yükleme betiği gerekmez).
      function action(name) {
        location.hash = `${name}-${Date.now()}`;
      }

      function setButtons(buttons) {
        const box = $('actions');
        box.replaceChildren(
          ...buttons.map(([label, name, secondary]) => {
            const b = document.createElement('button');
            b.textContent = label;
            if (secondary) b.className = 'secondary';
            b.onclick = () => action(name);
            return b;
          }),
        );
      }

      // Ana süreç çağırır: webContents.executeJavaScript('setState(...)')
      window.setState = (s) => {
        let title = '';
        let detail = '';
        let bar = 'hidden';
        let buttons = [];
        switch (s.kind) {
          case 'checking':
            title = 'Güncellemeler denetleniyor…';
            bar = 'busy';
            break;
          case 'available':
          case 'downloading':
            title = s.version ? `Güncelleme indiriliyor (${s.version})` : 'Güncelleme indiriliyor…';
            if (s.total) {
              detail = `${mb(s.transferred)} / ${mb(s.total)} MB`;
              bar = 'progress';
              $('fill').style.width = `${Math.max(2, Math.min(100, s.percent)).toFixed(1)}%`;
            } else bar = 'busy';
            break;
          case 'ready':
          case 'installing':
            title = 'Güncelleme kuruluyor…';
            detail = 'Diskort birazdan yeniden açılacak.';
            bar = 'busy';
            break;
          case 'manual':
            title = `Diskort ${s.version} yayınlandı`;
            detail = 'Devam etmek için yeni sürümü indirip kurman gerekiyor.';
            buttons = [['İndir', 'download'], ['Çık', 'quit', true]];
            break;
          case 'error':
            title = 'Güncelleme indirilemedi';
            detail = s.message;
            buttons = [['Tekrar dene', 'retry'], ['Şimdilik aç', 'skip', true]];
            break;
          default:
            title = 'Başlatılıyor…';
            bar = 'busy';
        }
        $('title').textContent = title;
        $('detail').textContent = detail;
        $('bar').className = `bar ${bar === 'hidden' ? '' : 'show'} ${bar === 'busy' ? 'busy' : ''}`;
        if (bar === 'busy') $('fill').style.width = '';
        document.body.classList.toggle('still', buttons.length > 0);
        setButtons(buttons);
      };
    </script>
  </body>
</html>
