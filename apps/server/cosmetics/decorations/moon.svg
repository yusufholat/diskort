  </linearGradient>
  <radialGradient id="m" cx="0.3" cy="0.35" r="0.85">
    <stop offset="0" stop-color="#fffbeb"/><stop offset="0.6" stop-color="#fde68a"/><stop offset="1" stop-color="#fbbf24"/>
  </radialGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
