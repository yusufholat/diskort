plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.noisefilter'
version = '0.1.0'

android {
  namespace "expo.modules.noisefilter"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  // Birim testlerindeki ölçümler (DSP süresi) CI günlüğünde görünsün
  testOptions {
    unitTests.all {
      testLogging {
        events "passed", "failed"
        showStandardStreams = true
      }
    }
  }
}

dependencies {
  // DPDFNet modelini çalıştırır (CPU, ARM NEON). 1.22: daha yeni sürümlerde arm64 kütüphanesi
  // 18 MB'tan 32 MB'a çıkıyor (APK'ya sıkıştırılmadan girer); bu küçük model için gereken her şey var.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.22.0'
  // WebRTC'nin yakalama sonrası işlemcisi (LiveKitReactNative.audioProcessingController)
  implementation project(':livekit_react-native')

  testImplementation 'junit:junit:4.13.2'
}
