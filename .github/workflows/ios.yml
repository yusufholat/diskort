# iOS derlemesi (apps/mobile). Mac gerekmez: GitHub'ın macOS makinelerinde çalışır (depo herkese açık,
# macOS dakikaları ücretsiz). Ayrıntılar ve Apple hesabı adımları: docs/ios.md
#
# - Simülatör derlemesi (Actions → "iOS" → Run workflow): imzasız, iOS Simülatörü için Release derlemesi.
#   Uygulamanın (yerel modüller + JavaScript paketi) iOS'ta derlendiğini kanıtlar; Apple hesabı gerekmez.
# - İmzalı Ad Hoc IPA: yalnızca gizli değişkenler varsa (IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD,
#   IOS_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID). Yoksa iş "atlandı" görünür, hata vermez.
#   * Elle: IPA ve kurulum bildirimi (manifest.plist) "artifact" olarak saklanır.
#   * Sürüm iş akışından (release.yml): taslak sürüme yüklenir: Diskort-<sürüm>-ios.ipa ve iOS kablosuz
#     güncelleme paketi (Diskort-<sürüm>-ota-ios.json + dosyaları). Yerel kısım (parmak izi) değişmediyse
#     IPA yeniden derlenmez, önceki sürümünki taşınır (Android'deki APK gibi).
#   Sunucu, sürümde IPA görünce indirme sayfasında iPhone kartını açar ve /download/ios/manifest.plist'i üretir.
name: iOS

on:
  workflow_dispatch:
    inputs:
      simulator:
        description: Simülatör için imzasız derle (derleniyor mu denetimi)
        type: boolean
        default: true
      signed:
        description: İmzalı Ad Hoc IPA da derle (gizli değişkenler varsa)
        type: boolean
        default: true
  workflow_call:
    inputs:
      release-tag:
        description: Paketlerin yükleneceği sürüm etiketi
        type: string
        default: ''

permissions:
  contents: write

env:
  UPDATES_BASE_URL: https://diskort.ziroo.net/updates
  SERVER_URL: https://diskort.ziroo.net

jobs:
  simulator:
    name: iOS Simülatör (imzasız)
    if: inputs.release-tag == '' && inputs.simulator
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: En yeni Xcode'u seç
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Xcode: $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Tip denetimi
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit

      - name: Yerel kısmın parmak izi (iOS)
        id: runtime
        working-directory: apps/mobile
        run: |
          runtime=$(node scripts/runtime-version.mjs --platform ios)
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "Parmak izi: $runtime"

      - name: iOS projesini oluştur (expo prebuild)
        working-directory: apps/mobile
        env:
          DISKORT_RUNTIME_VERSION: ${{ steps.runtime.outputs.runtime }}
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: iOS ayarlarını denetle
        working-directory: apps/mobile/ios
        run: bash ../scripts/check-ios-project.sh

      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Derle (iOS Simülatörü, Release, imzasız)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Diskort.xcworkspace -scheme Diskort -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error:|.*: error:|warning: .*deprecated)' || true
          test -d build/Build/Products/Release-iphonesimulator/Diskort.app || {
            echo "::error::Diskort.app oluşmadı"; grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" | head -50; exit 1; }
          # JavaScript paketi uygulamaya gömülmüş olmalı (Release)
          test -f build/Build/Products/Release-iphonesimulator/Diskort.app/main.jsbundle || {
            echo "::error::main.jsbundle yok"; exit 1; }
          du -sh build/Build/Products/Release-iphonesimulator/Diskort.app

      - name: Derleme kaydı
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diskort-ios-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Simülatör uygulamasını paketle
        run: |
          cd apps/mobile/ios/build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/Diskort-ios-simulator.zip" Diskort.app

      - uses: actions/upload-artifact@v4
        with:
          name: diskort-ios-simulator
          path: Diskort-ios-simulator.zip
          retention-days: 7

  # Gizli değişkenler iş koşulunda doğrudan okunamaz: önce burada bakılır
  signing:
    name: İmza anahtarları var mı?
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$P12" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "İmza anahtarları var: IPA derlenecek."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS imza anahtarları yok (bkz. docs/ios.md); IPA derlenmeyecek."
          fi

  ipa:
    name: iOS Ad Hoc IPA
    needs: signing
    if: needs.signing.outputs.available == 'true' && (inputs.release-tag != '' || inputs.signed)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Sürüm etiketiyle uyumlu mu?
        id: version
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE_TAG" ] && [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Etiket ($RELEASE_TAG) ile apps/mobile/package.json sürümü (v$version) uyuşmuyor"
            exit 1
          fi

      - name: Yerel kısmın parmak izi (iOS)
        id: runtime
        working-directory: apps/mobile
        run: |
          runtime=$(node scripts/runtime-version.mjs --platform ios)
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "Parmak izi: $runtime"

      - name: Önceki sürümün IPA'sı kullanılabilir mi?
        id: reuse
        if: env.RELEASE_TAG != ''
        env:
          RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          prev_runtime=""
          if [ -n "$prev" ] && [ "$prev" != "$RELEASE_TAG" ]; then
            mkdir -p "$RUNNER_TEMP/prev"
            if gh release download "$prev" -R "$GITHUB_REPOSITORY" -p '*-ota-ios.json' -D "$RUNNER_TEMP/prev" \
              && gh release view "$prev" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q -- '-ios\.ipa$'; then
              prev_runtime=$(node -p "const d=process.argv[1];require(d+'/'+require('fs').readdirSync(d)[0]).runtimeVersion" "$RUNNER_TEMP/prev")
            fi
          fi
          echo "Önceki sürüm: ${prev:-yok} (iOS parmak izi: ${prev_runtime:-yok})"
          if [ -n "$prev_runtime" ] && [ "$prev_runtime" = "$RUNTIME" ]; then
            echo "Yerel kısım değişmedi: $prev IPA'sı taşınacak."
            echo "from=$prev" >> "$GITHUB_OUTPUT"
          else
            echo "Yerel kısım değişti (ya da önceki iOS sürümü yok): IPA derlenecek."
          fi

      - name: Önceki sürümün IPA'sını taşı
        if: steps.reuse.outputs.from != ''
        run: |
          mkdir -p dist
          gh release download "${{ steps.reuse.outputs.from }}" -R "$GITHUB_REPOSITORY" -p '*-ios.ipa' -D dist
          ls -la dist

      - name: En yeni Xcode'u seç
        if: steps.reuse.outputs.from == ''
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Xcode: $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: iOS projesini oluştur (expo prebuild)
        if: steps.reuse.outputs.from == ''
        working-directory: apps/mobile
        env:
          DISKORT_RUNTIME_VERSION: ${{ steps.runtime.outputs.runtime }}
        run: |
          pnpm exec expo prebuild --platform ios --no-install
          (cd ios && bash ../scripts/check-ios-project.sh)

      # Geçici anahtar zinciri: sertifika yalnızca bu makinede ve bu iş boyunca durur
      - name: İmza sertifikası ve dağıtım profili
        if: steps.reuse.outputs.from == ''
        id: signing
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/diskort.keychain-db"
          kc_password=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$kc_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$kc_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          aps=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" 2>/dev/null || echo yok)
          devices=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -c '^ ' || true)
          expires=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")
          echo "Profil: $uuid · $app_id · aps-environment=$aps · $devices cihaz · son geçerlilik $expires"
          case "$app_id" in
            *.com.diskort.app) ;;
            *) echo "::error::Profil com.diskort.app için değil ($app_id)"; exit 1 ;;
          esac
          if [ "$aps" = "yok" ]; then
            echo "::error::Profilde bildirim yetkisi (aps-environment) yok: App ID'de Push Notifications açılıp profil yeniden oluşturulmalı"
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          echo "profile=$uuid" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      # Yalnızca uygulama hedefi elle imzalanır (Pod hedeflerine dokunulmaz)
      - name: Xcode imza ayarları
        if: steps.reuse.outputs.from == ''
        working-directory: apps/mobile/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile }}
        run: |
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("Diskort.xcodeproj")
            target = project.targets.find { |t| t.name == "Diskort" } or abort "Diskort hedefi yok"
            target.build_configurations.each do |c|
              s = c.build_settings
              s["CODE_SIGN_STYLE"] = "Manual"
              s["DEVELOPMENT_TEAM"] = ENV["TEAM"]
              s["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              s["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
              s["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
            end
            project.save
          '

      - uses: actions/cache@v4
        if: steps.reuse.outputs.from == ''
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: CocoaPods
        if: steps.reuse.outputs.from == ''
        working-directory: apps/mobile/ios
        run: pod install

      - name: Arşivle ve Ad Hoc IPA çıkar
        if: steps.reuse.outputs.from == ''
        working-directory: apps/mobile/ios
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          xcodebuild -workspace Diskort.xcworkspace -scheme Diskort -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Diskort.xcarchive" \
            -derivedDataPath build COMPILER_INDEX_STORE_ENABLE=NO \
            archive | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error:|.*: error:)' || true
          test -d "$RUNNER_TEMP/Diskort.xcarchive" || { echo "::error::Arşiv oluşmadı"; exit 1; }
          # "release-testing" = Ad Hoc (Xcode 15.3'ten önceki adı "ad-hoc")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.diskort.app</key><string>$PROFILE_UUID</string></dict>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Diskort.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$RUNNER_TEMP/export/Diskort.ipa" "$GITHUB_WORKSPACE/dist/Diskort-$VERSION-ios.ipa"
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Derleme kaydı
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diskort-ios-ipa-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

      - name: Anahtar zincirini sil
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

      # Elle derlemede kurulum bildirimi: IPA'yı HTTPS ile sunan bir yere koyup adresini düzelterek
      # itms-services bağlantısıyla kurmak için. Sürümde gerekmez: sunucu kendisi üretir.
      - name: Kurulum bildirimi (manifest.plist)
        if: env.RELEASE_TAG == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > dist/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array><dict>
              <key>assets</key>
              <array><dict>
                <key>kind</key><string>software-package</string>
                <key>url</key><string>https://ORNEK.ADRES/Diskort-$VERSION-ios.ipa</string>
              </dict></array>
              <key>metadata</key>
              <dict>
                <key>bundle-identifier</key><string>com.diskort.app</string>
                <key>bundle-version</key><string>$VERSION</string>
                <key>kind</key><string>software</string>
                <key>title</key><string>Diskort</string>
              </dict>
            </dict></array>
          </dict>
          </plist>
          EOF

      - uses: actions/upload-artifact@v4
        if: env.RELEASE_TAG == ''
        with:
          name: diskort-ios-ipa
          path: dist/*
          retention-days: 14

      # Kablosuz güncelleme paketi (iOS): yalnızca IPA'yla aynı parmak izli uygulamalara gider
      - name: iOS OTA paketini hazırla
        if: env.RELEASE_TAG != ''
        working-directory: apps/mobile
        env:
          DISKORT_RUNTIME_VERSION: ${{ steps.runtime.outputs.runtime }}
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm exec expo export --platform ios --output-dir "$RUNNER_TEMP/ota-export"
          pnpm exec expo config --json --type public > "$RUNNER_TEMP/expo-config.json"
          node scripts/ota-manifest.mjs --platform ios --dist "$RUNNER_TEMP/ota-export" --out ../../dist-ota \
            --version "$VERSION" --runtime "$DISKORT_RUNTIME_VERSION" \
            --config "$RUNNER_TEMP/expo-config.json" --base-url "$UPDATES_BASE_URL"
          du -sh ../../dist-ota

      - name: Taslak sürüme yükle
        if: env.RELEASE_TAG != ''
        run: gh release upload "$RELEASE_TAG" dist/*.ipa dist-ota/* --clobber -R "$GITHUB_REPOSITORY"
