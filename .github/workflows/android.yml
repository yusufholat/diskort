# Android APK derlemesi (apps/mobile). İki kullanım:
# - Elle (Actions → "Android APK" → Run workflow): test APK'sı derlenir, "artifact" olarak saklanır.
# - Sürüm iş akışından (release.yml): APK taslak sürüme Diskort-<sürüm>-android.apk olarak yüklenir.
#
# APK, depoda olmayan kalıcı anahtarla imzalanır (gizli değişkenler: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS). Anahtar kaybedilirse kurulu uygulamalar güncellenemez.
name: Android APK

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: APK'nın yükleneceği sürüm etiketi (boşsa yalnızca artifact)
        type: string
        default: ''

permissions:
  contents: write

jobs:
  apk:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Sürüm etiketiyle uyumlu mu?
        if: inputs.release-tag != ''
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          if [ "v$version" != "${{ inputs.release-tag }}" ]; then
            echo "::error::Etiket (${{ inputs.release-tag }}) ile apps/mobile/package.json sürümü (v$version) uyuşmuyor"
            exit 1
          fi

      - name: Tip denetimi
        working-directory: apps/mobile
        run: pnpm exec tsc --noEmit

      - name: Firebase yapılandırması (bildirimler)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON yok; APK bildirimsiz derlenecek"
          else
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > apps/mobile/google-services.json
          fi

      - name: Android projesini oluştur (expo prebuild)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 gizli değişkeni yok"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/diskort-release.p12"

      - name: APK derle
        working-directory: apps/mobile/android
        env:
          ORG_GRADLE_PROJECT_DISKORT_UPLOAD_STORE_FILE: ${{ runner.temp }}/diskort-release.p12
          ORG_GRADLE_PROJECT_DISKORT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_DISKORT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_DISKORT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: İmzaları doğrula ve adlandır
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          out=apps/mobile/android/app/build/outputs/apk/release
          mkdir -p dist
          # universal: indirme sayfası (ilk kurulum); diğerleri: uygulama içi güncelleme (daha küçük)
          cp "$out/app-universal-release.apk" "dist/Diskort-$version-android.apk"
          cp "$out/app-arm64-v8a-release.apk" "dist/Diskort-$version-android-arm64-v8a.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/Diskort-$version-android-armeabi-v7a.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          keytool -exportcert -keystore "$RUNNER_TEMP/diskort-release.p12" -storetype PKCS12             -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" -file "$RUNNER_TEMP/diskort.der" >/dev/null
          for apk in dist/*.apk; do
            if ! result=$("$apksigner" verify "$apk" 2>&1); then
              echo "$result"
              echo "::error::$apk imzası geçersiz"
              exit 1
            fi
            # İmza bloğunda Diskort sertifikasının kendisi bulunmalı (hata ayıklama anahtarı değil)
            node -e "const fs=require('fs');if(!fs.readFileSync(process.argv[1]).includes(fs.readFileSync(process.argv[2]))){console.error('::error::'+process.argv[1]+' Diskort anahtarıyla imzalanmamış');process.exit(1)}" "$apk" "$RUNNER_TEMP/diskort.der"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: diskort-android-apk
          path: dist/*.apk
          retention-days: 14

      - name: Taslak sürüme yükle
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release-tag }}" dist/*.apk --clobber -R "$GITHUB_REPOSITORY"
